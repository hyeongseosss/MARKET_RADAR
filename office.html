<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 증권사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#0d0f14; --panel:#151821; --panel2:#1c2030; --line:#2a2f42; --ink:#e9ecf3; --dim:#8a91a6; --gold:#ffcf5c; --up:#ff5f6d; --down:#4ea3ff; --ok:#3ddc97; --warn:#ff9f43; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:Pretendard, system-ui, sans-serif; overflow:hidden; }
  .up { color:var(--up); } .down { color:var(--down); } .dim { color:var(--dim); } .ok { color:var(--ok); }
  button { font-family:inherit; cursor:pointer; }
  #app { height:100%; display:flex; flex-direction:column; max-width:1500px; margin:0 auto; }
  /* 위 막대 */
  header { display:flex; align-items:center; gap:8px; padding:8px 12px; background:#10131b; border-bottom:1px solid var(--line); }
  header .logo { font-family:"Galmuri11", monospace; font-size:15px; color:var(--gold); white-space:nowrap; }
  header .pill { font-size:11px; padding:3px 8px; border-radius:99px; background:var(--panel2); color:var(--dim); white-space:nowrap; display:flex; align-items:center; gap:5px; }
  header .pill i { width:7px; height:7px; border-radius:50%; background:#555; display:inline-block; }
  header .pill.on i { background:var(--ok); box-shadow:0 0 6px var(--ok); animation:pulse 2s infinite; }
  header .sp { flex:1; } header a { color:var(--dim); font-size:12px; text-decoration:none; white-space:nowrap; }
  #clock { font-size:12px; color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums; }
  @keyframes pulse { 50% { opacity:.45; } }
  main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0, 1fr); grid-template-rows:minmax(330px, 55%) minmax(0, 1fr); }
  main > section { min-width:0; }
  /* 방 */
  #roomwrap { position:relative; display:flex; flex-direction:column; min-height:0; border-bottom:1px solid var(--line); }
  #rooms { display:flex; gap:4px; padding:6px 8px 0; background:#10131b; }
  #rooms button { flex:1; border:0; border-radius:8px 8px 0 0; padding:7px 0; font-size:13px; background:#171a24; color:var(--dim); }
  #rooms button.on { background:#3b2c1e; color:#fff; } #rooms button[data-r="coin"].on { background:#1f2a3d; }
  #rooms button .bdg { font-size:10px; margin-left:4px; padding:1px 6px; border-radius:99px; background:var(--up); color:#fff; display:none; }
  #rooms button.meet .bdg { display:inline; animation:pulse 1.2s infinite; }
  #room { position:relative; flex:1; min-height:0; overflow:hidden; background:
      linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.25)), repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(0deg, #6e4d31 0 23px, #654529 23px 24px); }
  #room.coin { background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.25)), repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(0deg, #2a3348 0 23px, #263046 23px 24px); }
  .wallbar { position:absolute; left:0; right:0; top:0; height:9%; background:linear-gradient(#3c3a4a, #2c2a38); border-bottom:3px solid #1d1b26; }
  #room.coin .wallbar { background:linear-gradient(#1f2a3d, #172033); }
  .led { position:absolute; left:18%; right:calc(4% + 40px); top:1.6%; height:5.2%; background:#050806; border:2px solid #1d1b26; overflow:hidden; display:flex; align-items:center; z-index:1; }
  .led .run { white-space:nowrap; font-family:"Galmuri11", monospace; font-size:10px; color:#ffcf5c; animation:run 40s linear infinite; padding-left:100%; }
  .led .run b.up { color:#ff6b6b; font-weight:400; } .led .run b.down { color:#5ab0ff; font-weight:400; }
  @keyframes run { to { transform:translateX(-100%); } }
  .wclock { position:absolute; right:2%; top:1.4%; width:34px; height:34px; border-radius:50%; background:#f4efe4; border:3px solid #1d1b26; z-index:1; font-family:"Galmuri11", monospace; font-size:8px; color:#333; display:flex; align-items:center; justify-content:center; }
  .night { position:absolute; inset:0; background:rgba(4,8,22,.55); z-index:40; pointer-events:none; opacity:0; transition:opacity 1.2s; display:flex; align-items:center; justify-content:center; }
  .night.on { opacity:1; } .night span { font-family:"Galmuri11", monospace; color:#cfd8ff; font-size:13px; background:rgba(0,0,0,.45); padding:6px 12px; border-radius:8px; }
  #room.coin.late .wallbar:after { content:""; position:absolute; inset:0; background:rgba(0,0,30,.35); }
  .filters { display:flex; gap:4px; margin-bottom:6px; flex-wrap:wrap; }
  .filters button { border:1px solid var(--line); background:var(--panel2); color:var(--dim); border-radius:99px; font-size:11px; padding:2px 9px; }
  .filters button.on { background:#2b3350; color:#fff; border-color:#4a5580; }
  .gauge { position:relative; height:8px; border-radius:99px; background:linear-gradient(90deg, #4ea3ff, #2a2f42 50%, #ff5f6d); margin:6px 0 2px; }
  .gauge i { position:absolute; top:-3px; width:4px; height:14px; margin-left:-2px; background:#fff; border-radius:2px; box-shadow:0 0 4px #000; }
  .gl { display:flex; justify-content:space-between; font-size:10px; color:var(--dim); }
  .pop { position:absolute; transform:translate(-50%, -100%); font-size:13px; font-weight:800; padding:2px 8px; border-radius:99px; z-index:45; pointer-events:none;
         animation:pop 2.8s ease-out forwards; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  .pop.win { background:#3ddc97; color:#04210f; } .pop.loss { background:#ff5f6d; color:#2a0508; } .pop.go { background:#ffcf5c; color:#2a1d00; }
  @keyframes pop { 0% { opacity:0; margin-top:6px; } 12% { opacity:1; margin-top:0; } 75% { opacity:1; margin-top:-26px; } 100% { opacity:0; margin-top:-40px; } }
  #ctrl { position:absolute; right:8px; bottom:8px; z-index:55; display:none; gap:4px; }
  #ctrl.on { display:flex; } #ctrl button { border:1px solid #3a4160; background:rgba(16,19,27,.9); color:#cfd4e2; border-radius:99px; font-size:11px; padding:3px 9px; }
  #ctrl button.on { background:var(--gold); color:#000; }
  .rail2 { position:relative; height:6px; border-radius:99px; margin:5px 0 2px; background:linear-gradient(90deg, #ff9f43, #2a2f42 45%, #2a2f42 55%, #3ddc97); }
  .rail2 i { position:absolute; top:-3px; width:4px; height:12px; margin-left:-2px; background:#fff; border-radius:2px; box-shadow:0 0 4px #000; transition:left .6s; }
  .rail2 b { position:absolute; top:-1px; width:2px; height:8px; margin-left:-1px; background:var(--gold); }
  /* 발표 화면 · 주문 단말기 · 커피머신 */
  #board { position:absolute; left:24%; right:24%; top:1.4%; height:0; overflow:hidden; background:#0b1118; border:0 solid #1d1b26; border-radius:4px; z-index:4;
           transition:height .6s cubic-bezier(.3,.7,.3,1), border-width .3s; box-shadow:0 6px 18px rgba(0,0,0,.45); }
  #board.on { height:19%; border-width:3px; }
  #board .bt { font-size:10px; color:#ffcf5c; padding:3px 6px 0; font-family:"Galmuri11", monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #board svg { width:100%; height:calc(100% - 16px); display:block; }
  .term { position:absolute; width:26px; height:34px; transform:translate(-50%, -100%); z-index:3; }
  .term:before { content:""; position:absolute; left:2px; right:2px; top:0; height:18px; background:#111; border:2px solid #444; border-radius:2px; }
  .term:after { content:""; position:absolute; left:6px; right:6px; top:4px; height:10px; background:#1f4f8a; transition:background .2s, box-shadow .2s; }
  .term i { position:absolute; left:0; right:0; bottom:0; height:14px; background:#6b7280; border:2px solid #2a2f42; border-radius:2px; }
  .term.flash:after { background:#7CFC8A; box-shadow:0 0 12px #7CFC8A; animation:blink .25s steps(2) 6; }
  .term b { position:absolute; left:50%; top:100%; transform:translateX(-50%); font-family:"Galmuri11", monospace; font-size:8px; color:#cfd4e2; white-space:nowrap; background:rgba(0,0,0,.5); padding:0 3px; border-radius:2px; }
  .coffee { position:absolute; width:22px; height:30px; transform:translate(-50%, -100%); z-index:3; }
  .coffee:before { content:""; position:absolute; inset:0 0 6px 0; background:#3b3f4a; border:2px solid #1d1f26; border-radius:3px; }
  .coffee:after { content:""; position:absolute; left:6px; top:6px; width:10px; height:6px; background:#c0392b; border-radius:1px; }
  .coffee i { position:absolute; left:7px; bottom:6px; width:8px; height:7px; background:#f5f5f5; border-radius:0 0 3px 3px; }
  .coffee.brew i:after { content:"♨"; position:absolute; left:-2px; top:-12px; font-size:10px; color:#ddd; animation:pulse .8s infinite; }
  .tally { display:block; font-size:9px; margin-top:2px; color:#ffcf5c; }
  .req { font-size:10px; padding:1px 6px; border-radius:99px; background:#3b2c55; color:#d7c6ff; margin-left:4px; }
  .window { position:absolute; top:1.5%; height:5.5%; width:10%; background:linear-gradient(#7fb3e8, #c9e3ff); border:2px solid #1d1b26; opacity:.8; }
  .plant { position:absolute; width:18px; height:26px; transform:translate(-50%, -100%); z-index:1; }
  .plant:before { content:""; position:absolute; left:3px; bottom:0; width:12px; height:9px; background:#8a5a35; border:1px solid #3a2414; }
  .plant:after { content:""; position:absolute; left:0; bottom:8px; width:18px; height:18px; background:radial-gradient(circle at 40% 40%, #57b36a, #2f7a42); border-radius:50% 50% 45% 45%; border:1px solid #1e4b2a; }
  .desk { position:absolute; width:62px; height:34px; transform:translate(-50%, -30%); z-index:3; pointer-events:none; }
  .desk .top { position:absolute; left:0; right:0; top:12px; height:20px; background:#b9875a; border:2px solid #3b2716; border-radius:2px; box-shadow:0 4px 0 #3b2716; }
  #room.coin .desk .top { background:#5b6b88; border-color:#1b2232; box-shadow:0 4px 0 #1b2232; }
  .desk .mon { position:absolute; left:19px; top:0; width:24px; height:17px; background:#111; border:2px solid #333; border-radius:2px; z-index:1; }
  .desk .mon:after { content:""; position:absolute; inset:2px; background:#1f6f5c; transition:background .3s, box-shadow .3s; }
  .desk.hot .mon:after { background:#5dffb8; box-shadow:0 0 10px #5dffb8; }
  .desk .tag { position:absolute; left:50%; top:36px; transform:translateX(-50%); font-family:"Galmuri11", monospace; font-size:9px; color:#fff; background:rgba(0,0,0,.55); padding:0 4px; border-radius:3px; white-space:nowrap; }
  .table { position:absolute; left:50%; top:58%; width:30%; height:18%; transform:translate(-50%, -50%); background:#8c5b37; border:3px solid #3b2716; border-radius:50%; box-shadow:0 6px 0 #3b2716; z-index:1; }
  #room.coin .table { top:60%; background:#46536e; border-color:#1b2232; box-shadow:0 6px 0 #1b2232; }
  .table .sign { position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); font-family:"Galmuri11", monospace; font-size:10px; color:#ffffff66; white-space:nowrap; transition:color .3s; }
  .table.live .sign { color:#fff; text-shadow:0 0 6px #ffcf5c; }
  .agent { position:absolute; width:40px; height:44px; transform:translate(-50%, -100%); z-index:2; cursor:pointer;
           transition:left 1.6s cubic-bezier(.45,.05,.35,1), top 1.6s cubic-bezier(.45,.05,.35,1); }
  .agent.away { z-index:6; } .agent svg { display:block; margin:0 auto; transform-origin:50% 100%; }
  .agent.flip svg { transform:scaleX(-1); }
  .agent.walk svg { animation:bob .32s steps(2) infinite; } .agent.flip.walk svg { animation:bobf .32s steps(2) infinite; }
  .agent.type svg { animation:tap 1.1s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-3px); } } @keyframes bobf { 0%,100% { transform:scaleX(-1); } 50% { transform:scaleX(-1) translateY(-3px); } }
  @keyframes tap { 50% { transform:translateY(1px); } }
  .agent .nm { position:absolute; left:50%; top:calc(100% + 1px); transform:translateX(-50%); font-family:"Galmuri11", monospace; font-size:9px; color:var(--gold); text-shadow:1px 1px 0 #000; white-space:nowrap; opacity:0; transition:opacity .3s; }
  .agent.away .nm, .agent:hover .nm { opacity:1; }
  .agent .chip { position:absolute; left:50%; top:-10px; transform:translate(-50%, 4px); font-size:9px; padding:1px 5px; border-radius:99px; white-space:nowrap; opacity:0; transition:opacity .3s, transform .3s; color:#000; font-weight:700; }
  .agent .chip.on { opacity:1; transform:translate(-50%, 0); } .agent.say .chip { opacity:0; }
  .chip.yes { background:#ff7a85; } .chip.no { background:#6db7ff; } .chip.mid { background:#c9ccd6; } .chip.dec { background:var(--gold); }
  .agent.speak:before { content:""; position:absolute; left:50%; bottom:-4px; width:44px; height:12px; margin-left:-22px; border-radius:50%; background:rgba(255,207,92,.5); filter:blur(1px); }
  .bub { position:absolute; left:50%; bottom:calc(100% + 6px); transform:translate(-50%, 6px) scale(.96); background:#fff; color:#1b1d26; font-size:11px; line-height:1.4;
         padding:5px 8px; border-radius:8px; width:max-content; max-width:190px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:20; box-shadow:0 3px 10px rgba(0,0,0,.35); }
  .bub:after { content:""; position:absolute; left:50%; bottom:-5px; margin-left:-5px; border:5px solid transparent; border-top-color:#fff; border-bottom:0; }
  .bub.on { opacity:1; transform:translate(-50%, 0) scale(1); }
  .bub.think { background:#e9f1ff; color:#4a5068; font-style:italic; } .bub.think:after { border-top-color:#e9f1ff; }
  .bub.below { bottom:auto; top:calc(100% + 16px); } .bub.below:after { bottom:auto; top:-5px; border-top:0; border-bottom:5px solid #fff; }
  .bub.think.below:after { border-bottom-color:#e9f1ff; }
  .agent.say { z-index:30; }
  .dots i { display:inline-block; width:4px; height:4px; margin:0 1px; border-radius:50%; background:#888; animation:dot 1s infinite; } .dots i:nth-child(2) { animation-delay:.15s; } .dots i:nth-child(3) { animation-delay:.3s; }
  @keyframes dot { 50% { transform:translateY(-3px); background:#333; } }
  #decision { position:absolute; left:50%; top:50%; width:min(92%, 430px); transform:translate(-50%, -42%) scale(.96); background:rgba(16,19,27,.96); border:1px solid #3a4160; border-radius:12px; padding:12px 14px;
              z-index:50; opacity:0; pointer-events:none; transition:opacity .35s, transform .35s; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  #decision.on { opacity:1; transform:translate(-50%, -50%) scale(1); pointer-events:auto; }
  #decision h4 { margin:0 0 6px; font-size:15px; } #decision .ck { display:grid; grid-template-columns:1fr 1fr; gap:3px 10px; font-size:11.5px; margin:8px 0; }
  #decision .ck span > b { display:inline-block; width:16px; } #decision .pl { font-size:12px; color:var(--dim); line-height:1.5; }
  #toast { position:absolute; left:50%; top:14%; transform:translate(-50%, -12px); background:#2b2240; color:#fff; font-size:12px; padding:6px 12px; border-radius:99px; opacity:0; transition:all .35s; z-index:60; white-space:nowrap; }
  #toast.on { opacity:1; transform:translate(-50%, 0); }
  /* 오른쪽(아래) 패널 */
  #side { display:flex; flex-direction:column; min-height:0; background:var(--panel); }
  #summary { display:flex; gap:8px; padding:8px 10px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
  #summary::-webkit-scrollbar { display:none; }
  .card { background:var(--panel2); border-radius:10px; padding:7px 10px; min-width:118px; flex:none; }
  .card .k { font-size:10.5px; color:var(--dim); white-space:nowrap; } .card .v { font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; } .card .s { font-size:11px; color:var(--dim); white-space:nowrap; }
  #tabs { display:flex; gap:2px; padding:4px 10px 0; border-bottom:1px solid var(--line); }
  #tabs button { border:0; background:none; color:var(--dim); font-size:13px; padding:6px 10px 8px; border-bottom:2px solid transparent; }
  #tabs button.on { color:#fff; border-bottom-color:var(--gold); }
  #pane { flex:1; min-height:0; overflow:auto; padding:8px 10px 14px; font-size:13px; }
  #pane .row { display:flex; gap:8px; padding:6px 2px; border-bottom:1px solid #1f2333; animation:in .35s ease-out; }
  @keyframes in { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }
  .av { width:26px; height:26px; flex:none; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff; text-shadow:0 1px 1px #0008; }
  .row .bd { min-width:0; flex:1; } .row .hd { font-size:11.5px; } .row .hd b { margin-right:4px; } .row .hd .t { color:var(--dim); font-size:10.5px; margin-left:4px; }
  .row .tx { font-size:12.5px; color:#cfd4e2; line-height:1.45; word-break:keep-all; overflow-wrap:anywhere; }
  .row.k-meet .tx, .row.k-decide .tx { color:#fff; } .row.k-decide { background:linear-gradient(90deg, rgba(255,207,92,.08), transparent); } .row.k-trade { background:linear-gradient(90deg, rgba(61,220,151,.08), transparent); }
  .st { font-size:10px; padding:1px 6px; border-radius:99px; color:#000; font-weight:700; margin-left:4px; }
  .st.yes { background:#ff7a85; } .st.no { background:#6db7ff; } .st.mid { background:#c9ccd6; } .st.dec { background:var(--gold); }
  .mt { padding:8px 4px; border-bottom:1px solid #1f2333; cursor:pointer; } .mt:hover { background:#1a1e2b; }
  .mt .a { font-size:13px; } .mt .b { font-size:11px; color:var(--dim); margin-top:2px; }
  .dec { font-size:11px; font-weight:700; padding:1px 7px; border-radius:99px; }
  .dec.buy { background:rgba(255,95,109,.18); color:var(--up); } .dec.sell { background:rgba(78,163,255,.18); color:var(--down); } .dec.wait { background:#2a2f42; color:var(--dim); } .dec.hold { background:rgba(255,207,92,.15); color:var(--gold); }
  table.t { width:100%; border-collapse:collapse; font-size:12px; } table.t td, table.t th { padding:5px 4px; border-bottom:1px solid #1f2333; text-align:left; white-space:nowrap; } table.t th { color:var(--dim); font-weight:500; font-size:11px; }
  .sec { font-size:12px; color:var(--gold); margin:12px 0 4px; }
  .back { color:var(--dim); font-size:12px; border:0; background:none; padding:0 0 6px; }
  .ckl { display:grid; grid-template-columns:1fr 1fr; gap:3px 12px; font-size:12px; margin:6px 0; background:#1a1e2b; padding:8px; border-radius:8px; }
  #chartbox { display:flex; flex-direction:column; height:100%; min-height:260px; }
  .cbar { display:flex; gap:4px; flex-wrap:wrap; align-items:center; margin-bottom:6px; }
  .cbar button { border:1px solid var(--line); background:var(--panel2); color:var(--dim); border-radius:99px; font-size:11.5px; padding:3px 10px; }
  .cbar button.on { background:var(--gold); color:#000; border-color:var(--gold); }
  .cbar .px { margin-left:auto; font-size:14px; color:#fff; }
  #chart { flex:1; min-height:220px; border-radius:8px; overflow:hidden; }
  .leg { font-size:11px; color:var(--dim); margin-top:5px; line-height:1.5; }
  .note { font-size:10.5px; color:var(--dim); padding:6px 10px 8px; border-top:1px solid var(--line); }
  @media (max-width: 520px) { header .pill { display:none; } .desk .tag { font-size:8px; padding:0 2px; } .agent:not(.away) .nm .rl { display:none; } .bub { max-width:160px; font-size:10.5px; } }
  @media (min-width: 980px) {
    main { grid-template-columns:minmax(0, 1.45fr) minmax(400px, 1fr); grid-template-rows:1fr; }
    #roomwrap { border-bottom:0; border-right:1px solid var(--line); }
    .agent { transform:translate(-50%, -100%) scale(1.35); transform-origin:50% 100%; }
    .desk { transform:translate(-50%, -30%) scale(1.35); }
    .bub { font-size:10px; max-width:200px; } .table .sign { font-size:13px; }
    #pane { font-size:14px; } .row .tx { font-size:13.5px; }
  }
</style>
</head>
<body>
<div id="app">
  <header><span class="logo">AI 증권사</span><span class="pill" id="p-stock"><i></i><span>주식팀</span></span><span class="pill on"><i></i><span>코인팀 24시간</span></span><span class="sp"></span><span id="clock"></span><a href="index.html">웹앱 ›</a></header>
