<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Radar</title>
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- 아이폰 '홈 화면에 추가' 로 열면 주소창·툴바 없이 앱처럼 (상태 막대는 밝기 모드에 맞는 기본 색: 글자가 늘 잘 보이게) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Radar">
<meta name="application-name" content="Market Radar">
<meta name="format-detection" content="telephone=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --text: #15171a; --sub: #6b7280; --line: #e6e8ec;
  --accent: #2f6fed; --up: #e2463b; --down: #2f6fed; --flat: #8b93a1; --chip: #eef1f6; --gold: #d9a400;
  --s1: #2f6fed; --s2: #e2463b; --s3: #12a37f; --s4: #d9a400; --s5: #8e44d6; --s6: #ff7a1a; --s7: #0fb5c9; --s8: #d6417c;
  --fs: 15px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --card: #181b21; --text: #eef0f3; --sub: #9aa3af; --line: #262a32;
    --accent: #5b8cff; --up: #ff6b5e; --down: #5b8cff; --flat: #7d8590; --chip: #222631;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --card: #181b21; --text: #eef0f3; --sub: #9aa3af; --line: #262a32;
  --accent: #5b8cff; --up: #ff6b5e; --down: #5b8cff; --flat: #7d8590; --chip: #222631;
}
:root[data-size="big"] { --fs: 17px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); overscroll-behavior-y: contain;
  font: var(--fs)/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
  -webkit-font-smoothing: antialiased; padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
header { padding: calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 2px calc(16px + env(safe-area-inset-left)); display: flex; align-items: center; gap: 8px; max-width: 640px; margin: 0 auto; }
header h1 { margin: 0; font-size: 20px; letter-spacing: -0.3px; }
header .sub { color: var(--sub); font-size: 12px; }
header .btns { margin-left: auto; display: flex; gap: 6px; }
.ibtn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; height: 32px; min-width: 32px;
  font-size: 15px; cursor: pointer; padding: 0 8px; }
.status { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 16px 0; max-width: 640px; margin: 0 auto; }
.status span { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--chip); color: var(--sub); }
.status span.live { background: rgba(18,163,127,.15); color: #12a37f; font-weight: 600; }
.status span.stale { background: rgba(226,70,59,.12); color: var(--up); }
#ptr { text-align: center; color: var(--sub); font-size: 12.5px; height: 0; overflow: hidden; transition: height .15s; }
main { padding: 4px calc(16px + env(safe-area-inset-right)) 16px calc(16px + env(safe-area-inset-left)); max-width: 640px; margin: 0 auto; }
.card { background: var(--card); border-radius: 16px; padding: 14px; margin: 10px 0; border: 1px solid var(--line); }
/* 컴퓨터(넓은 화면): 카드를 2열(1100px~) · 3열(1600px~)로. 휴대폰은 그대로 한 줄 */
@media (min-width: 1100px) {
  header, .status, main { max-width: 1240px; }
  .tab { column-count: 2; column-gap: 16px; }
  .tab > * { break-inside: avoid; -webkit-column-break-inside: avoid; }
  .tab > .card { display: inline-block; width: 100%; margin: 0 0 14px; }
  .tab > .mk, .tab > div[style*="text-align:center"], #t-find > .card:first-child { column-span: all; }
  .tab > .mk { margin-bottom: 14px; }
  .page .body, #sheet .box { max-width: 880px; }
}
@media (min-width: 1600px) {
  header, .status, main { max-width: 1680px; }
  .tab { column-count: 3; }
}
.card h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
.card h2 .more, .link { margin-left: auto; font-size: 12.5px; color: var(--accent); font-weight: 500; cursor: pointer; background: none; border: 0; padding: 0; font-family: inherit; }
.muted { color: var(--sub); font-size: 13px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
[data-sym] { cursor: pointer; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 6px;
  border-radius: 8px; background: var(--chip); font-weight: 700; font-size: 13px; }
.chip { display: inline-block; padding: 4px 10px; border-radius: 999px; background: var(--chip); font-size: 12.5px; margin: 2px 4px 2px 0;
  border: 0; color: var(--text); cursor: pointer; font-family: inherit; white-space: nowrap; }
.chip.on { background: var(--accent); color: #fff; }
.chip.off { opacity: .4; }
.chips { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; flex-wrap: nowrap; }
.chips::-webkit-scrollbar { display: none; }
.chips .chip { flex: 0 0 auto; }
.bar { height: 8px; border-radius: 4px; background: var(--chip); position: relative; overflow: hidden; margin-top: 5px; }
.bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.bar .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line); }
.hbar { height: 10px; border-radius: 5px; background: var(--accent); }
.mk { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 4px; }
.mk::-webkit-scrollbar { display: none; }
.mk .m { flex: 0 0 auto; min-width: 104px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.mk .m .l { font-size: 12px; color: var(--sub); }
.mk .m .v { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
.mk .m .c { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.heat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.heat .t { border-radius: 10px; padding: 8px; min-height: 64px; color: #fff; cursor: pointer; }
.heat .t .s { font-weight: 700; font-size: 13px; }
.heat .t .a { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.heat .t .n { font-size: 11px; opacity: .85; }
.heat .t.big { grid-column: span 2; }
.vs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ol { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ol .col { background: var(--chip); border-radius: 12px; padding: 10px; }
.ol .who { font-size: 12.5px; color: var(--sub); }
.ol .view { font-size: 20px; font-weight: 800; margin: 2px 0; }
.ol .conf { font-size: 11px; color: var(--sub); letter-spacing: 1px; }
.ol .why { font-size: 12.5px; margin-top: 6px; line-height: 1.45; }
.ol .risk { font-size: 12px; color: var(--sub); margin-top: 4px; line-height: 1.4; }
.mv { border-radius: 12px; padding: 10px 12px; margin-top: 10px; background: var(--chip); font-size: 13px; line-height: 1.5; }
.clamp2, .clamp3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.clamp2 { -webkit-line-clamp: 2; } .clamp3 { -webkit-line-clamp: 3; }
.mvd { border-top: 1px solid var(--line); padding: 7px 0; font-size: 13px; }
.mvd summary { list-style: none; cursor: pointer; display: flex; gap: 6px; align-items: baseline; }
.mvd summary::-webkit-details-marker { display: none; }
.mvd summary .t { flex: 1; min-width: 0; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mvd[open] summary .t { display: none; }
.mvd .full { margin-top: 4px; line-height: 1.5; }
.vs.vs4 { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.lg { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px 14px; margin-top: 4px; }
.lg .row { min-width: 0; } .lg .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (min-width: 560px) { .lg { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.vs.vs4 .col { min-width: 0; padding: 8px 4px; }
.vs.vs4 .lbl { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vs.vs4 .ret { font-size: 15px; }
.vs .badge { font-size: 11px; color: var(--accent); }
.mv b.up, .mv b.down { font-size: 14px; }
.vs .col { background: var(--chip); border-radius: 12px; padding: 10px 8px; text-align: center; }
.vs .col.lead { outline: 2px solid var(--gold); }
.vs .icon { font-size: 22px; }
.vs .lbl { font-size: 12px; color: var(--sub); }
.vs .ret { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.meet p { margin: 6px 0; font-size: 14px; }
.meet b { display: inline-block; min-width: 54px; }
.lesson { font-size: 13.5px; margin: 4px 0; padding-left: 14px; position: relative; }
.lesson:before { content: "•"; position: absolute; left: 2px; color: var(--sub); }
details summary { list-style: none; cursor: pointer; }
details summary::-webkit-details-marker { display: none; }
details[open] .chev { transform: rotate(90deg); }
.chev { color: var(--sub); transition: transform .15s; }
.pos { font-size: 13px; color: var(--sub); padding: 3px 0 3px 36px; display: flex; justify-content: space-between; gap: 8px; }
nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
  display: flex; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); z-index: 5; }
nav button { flex: 1; background: none; border: 0; color: var(--sub); font: inherit; font-size: 11px; padding: 6px 0;
  display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
nav button .ic { font-size: 20px; line-height: 1; filter: grayscale(1); opacity: .7; }
nav button.on { color: var(--accent); font-weight: 600; }
nav button.on .ic { filter: none; opacity: 1; }
.tab { display: none; } .tab.on { display: block; }
.notice { font-size: 12px; color: var(--sub); text-align: center; margin: 18px 6px 4px; }
.empty { color: var(--sub); font-size: 13.5px; padding: 6px 0; }
.res { font-size: 12px; padding: 2px 7px; border-radius: 6px; background: var(--chip); white-space: nowrap; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tiles div { background: var(--chip); border-radius: 10px; padding: 8px 4px; text-align: center; }
.tiles b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.tiles span { font-size: 11.5px; color: var(--sub); }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: 13.5px; }
.kv div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.kv span:first-child { color: var(--sub); }
.tl { position: relative; padding-left: 18px; margin: 8px 0; }
.tl:before { content: ""; position: absolute; left: 5px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--accent)); }
.tl:after { content: ""; position: absolute; left: 8.5px; top: 16px; bottom: -10px; width: 1px; background: var(--line); }
.tl .h { font-size: 12.5px; color: var(--sub); }
.tl .b { font-size: 14px; }
input.search, input.field { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
  color: var(--text); font: inherit; outline: none; }
input.search:focus, input.field:focus { border-color: var(--accent); }
.big { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
svg text { fill: var(--sub); font-size: 10px; }
.brief { white-space: pre-wrap; font-size: 13.5px; margin-top: 6px; }
.term { border-bottom: 1px dotted var(--sub); cursor: help; }
.skel { background: linear-gradient(90deg, var(--chip) 25%, var(--line) 37%, var(--chip) 63%); background-size: 400% 100%;
  animation: sk 1.4s ease infinite; border-radius: 12px; height: 88px; margin: 10px 0; }
@keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
.flash-up { animation: fu 1.2s ease; } .flash-down { animation: fd 1.2s ease; }
@keyframes fu { 0% { background: rgba(226,70,59,.25); } 100% { background: transparent; } }
@keyframes fd { 0% { background: rgba(47,111,237,.25); } 100% { background: transparent; } }
/* 겹쳐 뜨는 화면 (종목 상세·계좌 상세) */
.page { position: fixed; inset: 0; background: var(--bg); z-index: 10; overflow-y: auto; display: none; padding-bottom: 30px; }
.page.on { display: block; }
.page .top { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left)); border-bottom: 1px solid transparent; }
.page .top.stuck { border-bottom-color: var(--line); }
.page .top .t { font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page .top .mini { opacity: 0; transition: opacity .15s; font-variant-numeric: tabular-nums; font-size: 14px; }
.page .top.stuck .mini { opacity: 1; }
.page .body { padding: 0 16px; max-width: 640px; margin: 0 auto; }
/* 🗺 시장 지도 */
.tmap { position: relative; width: 100%; border-radius: 10px; overflow: hidden; background: #2b2f3a; }
.tmap .sec { position: absolute; box-sizing: border-box; border: 1.5px solid #15171c; pointer-events: none; }
.tmap .sl { position: absolute; left: 3px; top: 1px; font-size: 10.5px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; max-width: calc(100% - 6px); text-overflow: ellipsis; }
.tmap .tmt { position: absolute; box-sizing: border-box; border: 0.5px solid rgba(0,0,0,.35); display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #fff; overflow: hidden; cursor: pointer; text-align: center; line-height: 1.15; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.tmap .tmt:hover { outline: 2px solid #fff; z-index: 2; }
/* 종목 화면 섹션 탭 */
.stabs { position: sticky; top: calc(46px + env(safe-area-inset-top)); z-index: 1; background: var(--bg); display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 6px 0; }
.stabs::-webkit-scrollbar { display: none; }
[id^="sec-"] { scroll-margin-top: calc(104px + env(safe-area-inset-top)); }
/* 관심종목 표 */
.ftab { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.ftab th { text-align: right; color: var(--sub); font-weight: 500; font-size: 11.5px; padding: 4px; cursor: pointer; white-space: nowrap; user-select: none; }
.ftab th:first-child, .ftab td:first-child { text-align: left; }
.ftab td { text-align: right; padding: 7px 4px; border-top: 1px solid var(--line); white-space: nowrap; }
.ftab .nm { font-weight: 600; max-width: 120px; overflow: hidden; text-overflow: ellipsis; display: block; }
@media (max-width: 420px) { .ftab .sp { display: none; } }
.brief { font-size: 14px; line-height: 1.7; }
.hsec { font-size: 13px; font-weight: 700; color: var(--sub); margin: 20px 2px 2px; letter-spacing: .2px; }
.hsec:first-child { margin-top: 6px; }
.scg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 560px) { .scg { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1100px) {
  .scg { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  #t-home { column-count: 1; }                      /* 홈은 섹션마다 격자로 (신문식 2단은 큰 카드가 한쪽에 몰림) */
  .hgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 0 16px; align-items: start; }
  .hgrid > .card { margin: 0 0 14px; }
  .hg-market:has(> .hmap) { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
  .hg-market:has(> .hmap) > .hmap { grid-column: 1; grid-row: 1 / span 6; }
  .hg-market:has(> .hmap) > :not(.hmap) { grid-column: 2; }
}
.sc { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 10px 12px; cursor: pointer; font-family: inherit; color: var(--text); min-width: 0; }
.sc .i { font-size: 20px; line-height: 1.2; } .sc .l { font-weight: 700; font-size: 13.5px; }
.sc .s { font-size: 11.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
@media (min-width: 1100px) {
  .page .body.wide { max-width: 1240px; }
  .dgrid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .dgrid .card { margin-top: 0; margin-bottom: 14px; }
}
.back { border: 0; background: none; color: var(--text); font-size: 22px; padding: 0 6px 0 0; cursor: pointer; line-height: 1; }
.heart { font-size: 22px; background: none; border: 0; cursor: pointer; padding: 0 4px; color: var(--up); }
.card.fs { position: fixed; inset: 0; z-index: 30; margin: 0; border-radius: 0; overflow-y: auto;
  padding: calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left)); }
/* 아래에서 올라오는 창 */
#sheet { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; display: none; align-items: flex-end; justify-content: center; }
#sheet.on { display: flex; }
#sheet .box { background: var(--card); width: 100%; max-width: 640px; border-radius: 20px 20px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 80vh; overflow-y: auto; }
#sheet h3 { margin: 4px 0 8px; font-size: 18px; }
#sheet p { margin: 0 0 8px; color: var(--sub); font-size: 14.5px; }
.go { width: 100%; height: 46px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; margin-top: 10px; }
.go.sub { background: var(--chip); color: var(--text); }
.dots { display: flex; gap: 6px; margin: 16px 0 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); width: 18px; border-radius: 4px; }
.pos52 { position: relative; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--down), var(--line), var(--up)); margin: 8px 0 2px; }
.pos52 i { position: absolute; top: -4px; width: 4px; height: 14px; border-radius: 2px; background: var(--text); }
</style>
</head>
<body>
<div id="ptr">↓ 당겨서 새로고침</div>
<header>
  <div><h1>📡 Market Radar</h1><div class="sub" id="updated">불러오는 중…</div></div>
  <div class="btns"><button class="ibtn" id="gsearch" aria-label="종목 검색">🔍</button><button class="ibtn" id="help" aria-label="사용법">?</button><button class="ibtn" id="reload" aria-label="새로고침">↻</button></div>
</header>
<div class="status" id="status"></div>
<main>
  <section class="tab on" id="t-home"><div class="skel"></div><div class="skel" style="height:140px"></div><div class="skel"></div></section>
  <section class="tab" id="t-fav"></section>
  <section class="tab" id="t-find"></section>
  <section class="tab" id="t-ai"></section>
  <section class="tab" id="t-more"></section>
  <div class="notice" id="notice"></div>
</main>
<nav>
  <button class="on" data-t="home"><span class="ic">🏠</span>홈</button>
  <button data-t="fav"><span class="ic">♥</span>관심</button>
  <button data-t="find"><span class="ic">🔍</span>발견</button>
  <button data-t="ai"><span class="ic">🤖</span>AI·계좌</button>
  <button data-t="more"><span class="ic">☰</span>더보기</button>
</nav>
<div class="page" id="page"></div>
<div id="sheet"><div class="box" id="sheetBox"></div></div>
<script>

function bar(ret, max) {
  const w = Math.min(Math.abs(ret) / (max || 1), 1) * 50;
  const style = ret >= 0 ? `left:50%;width:${w}%` : `right:50%;width:${w}%`;
  return `<div class="bar"><span class="mid"></span><i style="${style};background:${ret >= 0 ? "var(--up)" : "var(--down)"}"></i></div>`;
}
function spark(vals, w = 64, h = 26) {
  if (!vals || vals.length < 2) return "";
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - 2 - (v - lo) / (hi - lo || 1) * (h - 4)).toFixed(1)}`).join(" ");
  const col = vals[vals.length - 1] >= vals[0] ? "var(--up)" : "var(--down)";
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5"/></svg>`;
}
const stock = (sym) => (IDX && IDX.stocks.find((x) => x.symbol === sym)) || null;
function stockRow(x, extra = "") {
  const s = stock(x.symbol) || x;
  return `<div class="row" data-sym="${esc(x.symbol)}" data-p="${s.price ?? ""}"><div class="grow"><div class="name">${esc(s.name || x.name || x.symbol)}</div>
    <div class="muted">${esc(x.symbol)}${s.sector ? " · " + esc(s.sector) : ""}${extra}</div></div>
    ${s.spark ? spark(s.spark) : ""}
    <div class="num">${s.price != null ? `<div>${money(s.price, x.symbol)}</div>` : ""}<div class="${cls(s.change || 0)}">${pct(s.change)}</div></div></div>`;
}

function ago(ts) {
  const m = Math.max(0, Math.round((Date.now() / 1000 - ts) / 60));
  return m < 1 ? "방금" : m < 60 ? `${m}분 전` : m < 1440 ? `${Math.floor(m / 60)}시간 전` : `${Math.floor(m / 1440)}일 전`;
}
function heatColor(v) {
  const a = Math.min(Math.abs(v) / 3, 1) * 0.75 + 0.25;
  return v >= 0 ? `rgba(226,70,59,${a})` : `rgba(47,111,237,${a})`;
}

  if (!c) return "";

}

function liveMk(m) { const now = Date.now(); return ((D && D.sessions || {})[m] || []).some((w) => Date.parse(w.start) <= now && now < Date.parse(w.end)); }
function heatOf(d) {                                   // 지금 볼 시장의 섹터 히트맵 (국장 장중이면 국장부터)
  const all = (d.market || {}).heatmap || [], mk = heatMk || (liveMk("KR") ? "KR" : "US");
  const has = (m) => all.some((x) => (x.market || "US") === m);
  const m = has(mk) ? mk : has("US") ? "US" : "KR";
  return { m, rows: all.filter((x) => (x.market || "US") === m), both: has("US") && has("KR") };
}
function heatTabs(h) {
  return h.both ? `<span class="chips" style="margin-left:auto">${[["US", "🇺🇸"], ["KR", "🇰🇷"]].map(([k, l]) => `<button class="chip ${h.m === k ? "on" : ""}" data-heat="${k}">${l}</button>`).join("")}</span>` : "";
}
function flowCards(f) {                                // 코스피 투자자별 순매수 (억원)
  if (!f) return [];
  const t = (v) => (Math.abs(v) >= 10000 ? `${(v / 10000).toFixed(1)}조` : `${Math.round(v).toLocaleString("ko-KR")}억`);
  return [["foreigner", "외국인"], ["institution", "기관"], ["individual", "개인"]].filter(([k]) => f[k] != null)
    .map(([k, l]) => ({ label: `${l} 순매수`, text: (f[k] > 0 ? "+" : "") + t(f[k]), sign: f[k], note: `코스피 · ${f.day.slice(5).replace("-", "/")}` }));
}
function hm(ms) { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)}시간 ${m % 60}분` : `${m}분`; }
function statusBar() {
  if (!D) return "";
  const now = Date.now(), out = [];
  for (const [m, flag] of [["US", "🇺🇸 미장"], ["KR", "🇰🇷 국장"]]) {
    const ws = ((D.sessions || {})[m] || []).map((w) => ({ s: Date.parse(w.start), e: Date.parse(w.end) }));
    const open = ws.find((w) => w.s <= now && now < w.e);
    const next = ws.filter((w) => w.s > now).sort((a, b) => a.s - b.s)[0];
    if (open) out.push(`<span class="live">${flag} 장중 · 마감까지 ${hm(open.e - now)}</span>`);
    else if (next && next.s - now < 18 * 3600e3) out.push(`<span>${flag} 시작까지 ${hm(next.s - now)}</span>`);
    else if (ws.length) out.push(`<span>${flag} 마감</span>`);
  }
  const anyLive = ["US", "KR"].some((m) => liveMk(m));
  if (now / 1000 - D.updated_ts > (anyLive ? 1800 : 5400)) out.push(`<span class="stale">⚠️ ${ago(D.updated_ts)} 자료 (업데이트 지연)</span>`);   // 장 밖엔 60분마다 올라와서 90분까지는 정상
  return out.join("");
}

function favs() { return store.get("fav", { folders: [{ name: "기본", syms: [] }] }); }
function saveFavs(f) { store.set("fav", f); }
function isFav(sym) { return favs().folders.some((f) => f.syms.includes(sym)); }
function toggleFav(sym) {
  const f = favs();
  if (isFav(sym)) f.folders.forEach((x) => (x.syms = x.syms.filter((s) => s !== sym)));
  else f.folders[0].syms.unshift(sym);
  saveFavs(f); haptic();

function chosung(s) {
  return [...s].map((ch) => { const c = ch.charCodeAt(0) - 0xac00; return c >= 0 && c < 11172 ? CHO[Math.floor(c / 588)] : ch; }).join("");

function matches(x, q) {
  const s = q.trim().toLowerCase();
  if (!s) return true;
  const hay = [x.symbol, x.name, x.eng || "", x.sector || ""].join(" ").toLowerCase();
  if (hay.includes(s)) return true;
  if (/^[ㄱ-ㅎ]+$/.test(s)) return chosung(x.name).includes(s);
  return hay.replace(/\s/g, "").includes(s.replace(/\s/g, ""));
}

function curveSvg(days, series, codes, H = 190) {
  const W = 340, P = { l: 34, r: 8, t: 10, b: 22 };
  const vals = codes.flatMap((c) => series[c].filter((v) => v != null));
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi - lo < 1) { hi += 0.5; lo -= 0.5; }
  const x = (i) => P.l + (W - P.l - P.r) * (i / Math.max(1, days.length - 1));

  svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--sub)" stroke-dasharray="2 3"/>`;
  svg += `<text x="${P.l}" y="${H - 6}">${esc(days[0].slice(5))}</text><text x="${W - P.r}" y="${H - 6}" text-anchor="end">${esc(days[days.length - 1].slice(5))}</text>`;
  for (const c of codes) {

function rebased(period) {
  const { days, series } = D.curve;

}

function donut(parts) {
  const total = parts.reduce((a, p) => a + p.v, 0) || 1;
  let ang = -Math.PI / 2, s = `<svg viewBox="0 0 120 120" width="120" height="120" aria-label="보유 비중">`;
  const cols = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)", "var(--s7)", "var(--s8)"];
  parts.forEach((p, i) => {
    const a2 = ang + (p.v / total) * Math.PI * 2, large = a2 - ang > Math.PI ? 1 : 0;
    const x1 = 60 + 50 * Math.cos(ang), y1 = 60 + 50 * Math.sin(ang), x2 = 60 + 50 * Math.cos(a2), y2 = 60 + 50 * Math.sin(a2);
    p.color = p.c || cols[i % cols.length];
    s += p.v / total > 0.999 ? `<circle cx="60" cy="60" r="50" fill="${p.color}"/>` : p.v > 0 ? `<path d="M60 60 L${x1} ${y1} A50 50 0 ${large} 1 ${x2} ${y2} Z" fill="${p.color}"/>` : "";
    ang = a2;
  });
  return s + `<circle cx="60" cy="60" r="30" fill="var(--card)"/></svg>`;
}

function drawChart() { const el = $("#chart"); if (el) { el.innerHTML = chartHtml(); if (useLW()) lwMount(); } }
let raf = null;

function zoomBy(f) { const all = barsFor(CH.iv); if (!all) return; CH.count = Math.round(CH.count * f); CH.sel = null; clampView(all.length); redraw(); }
function setupChart(el) {
  let drag = null, pinch = null;
  const idxAt = (clientX) => {
    const r = el.querySelector("#chartSvg").getBoundingClientRect(), xv = ((clientX - r.left) / r.width) * CH.vis.W;
    if (CH.vis.line) return Math.round(((xv - CH.vis.P.l) / (CH.vis.W - CH.vis.P.l - CH.vis.P.r)) * (CH.vis.n - 1));
    return Math.floor((xv - CH.vis.P.l) / CH.vis.step);
  };
  el.addEventListener("pointerdown", (e) => {
    if (!e.target.closest("#chartSvg") || pinch || !CH.vis) return;
    drag = { x: e.clientX, moved: false, end: CH.end, id: e.pointerId };
    if (CH.vis.line) { CH.sel = Math.max(0, Math.min(CH.vis.n - 1, idxAt(e.clientX))); redraw(); }
  });
  el.addEventListener("pointermove", (e) => {
    if (!drag || drag.id !== e.pointerId || pinch || !CH.vis) return;
    const dx = e.clientX - drag.x;
    if (Math.abs(dx) > 6) drag.moved = true;
    if (CH.vis.line) { CH.sel = Math.max(0, Math.min(CH.vis.n - 1, idxAt(e.clientX))); redraw(); return; }
    if (drag.moved) {
      const r = el.querySelector("#chartSvg").getBoundingClientRect(), barPx = (CH.vis.step / CH.vis.W) * r.width, all = barsFor(CH.iv);
      CH.end = (drag.end == null ? all.length : drag.end) - Math.round(dx / barPx); CH.sel = null; clampView(all.length); redraw();
    }
  });
  const end = () => {
    if (drag && drag.moved) { el.dataset.dragged = "1"; setTimeout(() => delete el.dataset.dragged, 50); }
    drag = null;
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  el.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2 && e.target.closest("#chartSvg") && CH.mode === "candle") {
      pinch = { d: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), count: CH.count }; drag = null;
    }
  }, { passive: true });
  el.addEventListener("touchmove", (e) => {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), all = barsFor(CH.iv);
    CH.count = Math.round(pinch.count * pinch.d / Math.max(20, d)); CH.sel = null; clampView(all.length); redraw();
  }, { passive: false });
  el.addEventListener("touchend", (e) => { if (e.touches.length < 2) pinch = null; });
  el.addEventListener("wheel", (e) => {
    if (!e.target.closest("#chartSvg") || CH.mode !== "candle") return;
    e.preventDefault();
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { const all = barsFor(CH.iv); CH.end = (CH.end == null ? all.length : CH.end) - Math.round(e.deltaX / 20); clampView(all.length); redraw(); }
    else zoomBy(e.deltaY > 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });
}
function periodReturns(bars, price) {
  const out = [];
  if (price == null) return out;
  for (const [n, l] of [[5, "1주"], [22, "1달"], [66, "3달"], [126, "6달"], [252, "1년"]]) {
    if (bars.length > n) out.push([l, (price / bars[bars.length - 1 - n][4] - 1) * 100]);
  }
  return out;
}
function ifBought(bars, price) {
  const rows = [];
  if (price == null) return rows;
  for (const [n, l] of [[22, "1달 전"], [126, "6달 전"], [252, "1년 전"], [bars.length - 1, `${bars[0] ? bars[0][0].slice(2, 7).replace("-", ".") : ""} (처음 기록)`]]) {
    if (bars.length > n && n > 0) rows.push([l, 1_000_000 * price / bars[bars.length - 1 - n][4]]);
  }
  return rows;
}

let stack = [];
function openPage(title, mini, body, key, push = true) {

  pg.classList.add("on"); pg.scrollTop = 0; document.body.style.overflow = "hidden";
  if (push) { stack.push(key); history.pushState({ k: key }, ""); }
  updBack();
}
function fillPage(title, mini, body) {

  pg.querySelector(".t").innerHTML = title; pg.querySelector(".mini").innerHTML = mini; pg.querySelector(".body").innerHTML = body;
}
function closePage() { $("#page").classList.remove("on"); document.body.style.overflow = ""; CH.fs = false; if (LWC) { try { LWC.chart.remove(); } catch (e) {} LWC = null; } updBack(); }
function updBack() {
  if (!inTg || !tg.BackButton) return;
  try { if ($("#page").classList.contains("on") || $("#sheet").classList.contains("on")) tg.BackButton.show(); else tg.BackButton.hide(); } catch (e) {}
}
window.addEventListener("popstate", () => {
  if ($("#sheet").classList.contains("on")) { $("#sheet").classList.remove("on"); updBack(); return; }
  if (CH.fs) { CH.fs = false; const c = $("#chart"); if (c) c.closest(".card").classList.remove("fs"); drawChart(); return; }
  stack.pop();
  const k = stack[stack.length - 1];

  if (k.startsWith("s:")) openStock(k.slice(2), false);
  else if (k.startsWith("acct:")) openAcct(k.slice(5), false);
  else if (k === "coin") openPage("🪙 코인 신호", "BTC·ETH", coinCard(D.coin, true), "coin", false);

});

  ["🤖", "AI 계좌 · 전망 · 예측 리그", "주식 연습 계좌 여러 개가 각자 방법으로 매매해요 (F Gemini · G Groq · H 둘이 회의 · K 국장). 🔮 AI 시장 전망과 🏆 예측 리그에서 사람과 AI 가 맞히기 대결도 해요. 실제 돈이 아니고 투자 권유도 아니에요."],
  ["🪙", "코인 신호 · 코인 계좌", "BTC·ETH 4시간봉 신호, 코인 연습 계좌(규칙 A·B, Gemini AI), 시장 심리·옵션 벽을 🧭 더 보기의 코인에서 봐요. 레버리지는 최대 3배, 실제 주문 없음."],
];
let obi = 0;
function onboard(i) {
  obi = i;
  const [em, t, p] = OB[i];
  sheet(`<div style="font-size:44px">${em}</div><h3>${esc(t)}</h3><p>${esc(p)}</p><div class="dots">${OB.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>
    <button class="go" data-obnext>${i === OB.length - 1 ? "시작하기" : "다음"}</button>`, i === 0);
}

// ================================================================ 그리기 · 이동 · 새로고침
function flash() {
  document.querySelectorAll("[data-p]").forEach((el) => {
    const s = el.dataset.sym, p = parseFloat(el.dataset.p);
    if (!s || isNaN(p)) return;
    if (PREV[s] != null && PREV[s] !== p) el.classList.add(p > PREV[s] ? "flash-up" : "flash-down");
  });
  if (IDX) IDX.stocks.forEach((x) => (PREV[x.symbol] = x.price));
}
function render() {
  $("#t-home").innerHTML = home(D);
  $("#t-fav").innerHTML = favTab();
  if (!(cur === "find" && document.activeElement && document.activeElement.id === "q")) $("#t-find").innerHTML = findTab();
  $("#t-ai").innerHTML = aiTab();
  $("#t-more").innerHTML = moreTab();
  $("#notice").textContent = D.notice;
  stamp(); flash();
}
function stamp() { if (!D) return; $("#updated").textContent = `${ago(D.updated_ts)} 업데이트 · 가상계좌 · 실제 주문 없음`; $("#status").innerHTML = statusBar(); }
const TABS = ["home", "fav", "find", "ai", "more"];
function show(t) {
  cur = t;
  document.querySelectorAll(".tab").forEach((s) => s.classList.toggle("on", s.id === "t-" + t));
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
  if (t === "fav" && D) $("#t-fav").innerHTML = favTab();
  window.scrollTo(0, 0); haptic();
}
document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => show(b.dataset.t)));
function share(sym) {
  const x = stock(sym) || {};
  const base = D.app_url || location.href.split("#")[0];
  const url = `${base}#s=${encodeURIComponent(sym)}`, text = `${x.name || sym} ${x.price != null ? money(x.price, sym) : ""} ${x.change != null ? pct(x.change) : ""} · Market Radar`;
  if (navigator.share) return navigator.share({ title: x.name || sym, text, url }).catch(() => {});
  openTg(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`);
}
document.addEventListener("click", (e) => {
  const q = (sel) => e.target.closest(sel);
  let el;
  if ((el = q("[data-term]"))) { e.stopPropagation(); return sheet(`<h3>📖 ${esc(el.dataset.term)}</h3><p>${esc(TERMS[el.dataset.term] || "")}</p><button class="go" data-close>확인</button>`); }
  if (q("[data-close]")) return closeSheet();
  if (q("[data-obnext]")) { if (obi < OB.length - 1) onboard(obi + 1); else { store.set("ob_done2", 1); closeSheet(); } return; }
  if (q("[data-onboard]")) return onboard(0);
  if ((el = q("[data-sheet]"))) { const k = el.dataset.sheet; return sheet(k.startsWith("folder:") ? folderEditor(+k.slice(7)) : SHEETS[k]()); }
  if (q("[data-back]")) return history.back();
  if ((el = q("[data-go]"))) return show(el.dataset.go);
  if ((el = q("[data-open]"))) return openTg(el.dataset.open);
  if ((el = q("[data-fav]"))) { toggleFav(el.dataset.fav); el.textContent = isFav(el.dataset.fav) ? "♥" : "♡"; return; }
  if ((el = q("[data-share]"))) return share(el.dataset.share);
  if ((el = q("[data-alert]"))) {
    const v = ($("#alPrice").value || "").replace(/[^0-9.]/g, "");
    if (!v) return $("#alPrice").focus();
    if (!D.bot) return alert("텔레그램에서 /가격알림 " + el.dataset.alert + " " + v + " 를 보내 주세요");
    return openTg(`https://t.me/${D.bot}?start=al_${encodeURIComponent(el.dataset.alert)}_${v.replace(".", "p")}`);
  }
  if ((el = q("[data-size]"))) { store.set("size", el.dataset.size); document.documentElement.dataset.size = el.dataset.size === "big" ? "big" : ""; $("#t-more").innerHTML = moreTab(); return; }
  if ((el = q("[data-hmove]"))) { const [i, d] = el.dataset.hmove.split(":").map(Number), L = homeLayout(); [L[i], L[i + d]] = [L[i + d], L[i]]; store.set("home2", L); $("#sheetBox").innerHTML = homeEditor(); $("#t-home").innerHTML = home(D); return; }
  if ((el = q("[data-hon]"))) { const L = homeLayout(); L[+el.dataset.hon].on = !L[+el.dataset.hon].on; store.set("home2", L); $("#sheetBox").innerHTML = homeEditor(); $("#t-home").innerHTML = home(D); return; }
  if (q("[data-hreset]")) { store.set("home2", null); $("#sheetBox").innerHTML = homeEditor(); $("#t-home").innerHTML = home(D); return; }
  if (q("[data-newfolder]")) { const n = prompt("새 폴더 이름"); if (n) { const f = favs(); f.folders.push({ name: n.slice(0, 20), syms: [] }); saveFavs(f); $("#t-fav").innerHTML = favTab(); } return; }
  if ((el = q("[data-fmove]"))) { const [fi, i, d] = el.dataset.fmove.split(":").map(Number), f = favs(), a = f.folders[fi].syms; [a[i], a[i + d]] = [a[i + d], a[i]]; saveFavs(f); $("#sheetBox").innerHTML = folderEditor(fi); $("#t-fav").innerHTML = favTab(); return; }
  if ((el = q("[data-fdel]"))) { const [fi, i] = el.dataset.fdel.split(":").map(Number), f = favs(); f.folders[fi].syms.splice(i, 1); saveFavs(f); $("#sheetBox").innerHTML = folderEditor(fi); $("#t-fav").innerHTML = favTab(); return; }
  if ((el = q("[data-frm]"))) { const fi = +el.dataset.frm, f = favs(); f.folders[0].syms.push(...f.folders[fi].syms.filter((s) => !f.folders[0].syms.includes(s))); f.folders.splice(fi, 1); saveFavs(f); closeSheet(); $("#t-fav").innerHTML = favTab(); return; }
  if ((el = q("[data-toggle]"))) { const c = el.dataset.toggle; hidden.has(c) ? hidden.delete(c) : hidden.add(c); $("#t-ai").innerHTML = aiTab(); return; }
  if ((el = q("[data-cp]"))) { curvePeriod = el.dataset.cp; $("#t-ai").innerHTML = aiTab(); return; }
  if (q("[data-coin]")) { openPage("🪙 코인 신호", "BTC·ETH", coinCard(D.coin, true), "coin"); return; }
  if ((el = q("[data-tl]"))) { tlFilter = el.dataset.tl; tlMore = false; $("#t-ai").innerHTML = aiTab(); return; }
  if (q("[data-tlmore]")) { tlMore = true; const y = scrollY; $("#t-ai").innerHTML = aiTab(); scrollTo(0, y); return; }
  if ((el = q("[data-heat]"))) { heatMk = el.dataset.heat; store.set("heatMk", heatMk); $("#t-home").innerHTML = home(D); $("#t-find").innerHTML = findTab(); if (stack[stack.length - 1] === "map") openMap(false); return; }
  if (q("[data-map]")) return openMap();
  if ((el = q("[data-hpage]"))) return openHomePage(el.dataset.hpage);
  if (q("[data-scr]")) return openScr();
  if ((el = q("[data-scrmk]"))) { SCR.mk = el.dataset.scrmk; SCR.sec = ""; return scrRefresh(); }
  if ((el = q("[data-scrc]"))) { const k = el.dataset.scrc; SCR.c = SCR.c.includes(k) ? SCR.c.filter((x) => x !== k) : [...SCR.c, k]; return scrRefresh(); }
  if (q("[data-scrreset]")) { SCR = { mk: "all", sec: "", c: [], sort: "chg" }; return scrRefresh(); }
  if ((el = q("[data-jump]"))) { const t = document.getElementById(el.dataset.jump); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
    document.querySelectorAll(".stabs [data-jump]").forEach((b) => b.classList.toggle("on", b === el)); return; }
  if (q("[data-favview]")) { store.set("favView", store.get("favView", "table") === "table" ? "list" : "table"); $("#t-fav").innerHTML = favTab(); return; }
  if ((el = q("[data-fsort]"))) { const k = el.dataset.fsort; favSort = favSort.k === k ? { k, dir: -favSort.dir } : { k, dir: k === "name" ? 1 : -1 }; store.set("favSort", favSort); $("#t-fav").innerHTML = favTab(); return; }
  if ((el = q("[data-cmp]"))) return openCmp(el.dataset.cmp);
  if ((el = q("[data-cmpp]"))) { CMP.per = el.dataset.cmpp; store.set("cmpPer", CMP.per); fillPage($("#page .t").innerHTML, "", cmpHtml()); return cmpMount(); }
  if ((el = q("[data-ranksort]"))) { rankSort = el.dataset.ranksort; store.set("rankSort", rankSort); $("#t-home").innerHTML = home(D); if (stack[stack.length - 1] === "home:rank") openHomePage("rank", false); return; }
  if ((el = q("[data-rank]"))) { rankTab = el.dataset.rank; $("#t-find").innerHTML = findTab(); return; }
  if ((el = q("[data-sec]")) || (el = q("[data-sector]"))) {
    findQ = el.dataset.sec || el.dataset.sector;
    if ($("#page").classList.contains("on")) { stack = []; closePage(); }
    show("find"); $("#t-find").innerHTML = findTab(); return;
  }
  if ((el = q("[data-q]"))) { findQ = el.dataset.q; $("#t-find").innerHTML = findTab(); return; }
  if ((el = q("[data-acct]"))) return openAcct(el.dataset.acct);
  if ((el = q("[data-mode]"))) { CH.mode = el.dataset.mode; store.set("chartMode", CH.mode); CH.sel = null; return drawChart(); }
  if ((el = q("[data-lp]")) && !el.disabled) { CH.lp = el.dataset.lp; CH.sel = null; return drawChart(); }
  if ((el = q("[data-iv]")) && !el.disabled) { CH.iv = el.dataset.iv; CH.sel = null; CH.end = null; CH.count = DEFAULT_VIEW[CH.iv]; return drawChart(); }
  if ((el = q("[data-ov]"))) { CH.ov = { ...CH.ov, [el.dataset.ov]: !CH.ov[el.dataset.ov] }; store.set("chartOv", CH.ov); return drawChart(); }
  if (q("[data-draw]")) { CH.draw = !CH.draw; return drawChart(); }
  if (q("[data-hlclear]")) { store.set(hlKey(), []); return drawChart(); }
  if (q("[data-lwfit]")) { if (LWC) LWC.reset = true; return drawChart(); }
  if (q("[data-bb]")) { CH.bb = !CH.bb; store.set("chartBB", CH.bb); return drawChart(); }
  if ((el = q("[data-ind]"))) { CH.ind = CH.ind === el.dataset.ind ? "" : el.dataset.ind; store.set("chartInd", CH.ind); return drawChart(); }
  if ((el = q("[data-ma]"))) { const n = +el.dataset.ma; CH.ma.has(n) ? CH.ma.delete(n) : CH.ma.add(n); return drawChart(); }
  if ((el = q("[data-zoom]"))) { if (el.dataset.zoom === "reset") { CH.end = null; CH.count = DEFAULT_VIEW[CH.iv]; CH.sel = null; drawChart(); } else zoomBy(el.dataset.zoom === "in" ? 0.7 : 1.4); return; }
  if (q("[data-fs]")) {
    if (!CH.fs) { CH.fs = true; history.pushState({ fs: 1 }, ""); $("#chart").closest(".card").classList.add("fs"); drawChart();
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {}); }
    else history.back();
    return;
  }
  if ((el = q("#chartSvg")) && CH.vis && !CH.vis.line && !$("#chart").dataset.dragged) {
    const r = el.getBoundingClientRect(), xv = ((e.clientX - r.left) / r.width) * CH.vis.W, i = Math.floor((xv - CH.vis.P.l) / CH.vis.step);
    if (i >= 0 && i < CH.vis.n) { CH.sel = i; drawChart(); } return;
  }
  if ((el = q("[data-sym]")) && !q("summary")) {
    if ($("#sheet").classList.contains("on")) { $("#sheet").classList.remove("on"); stack.push("s:" + el.dataset.sym); history.replaceState({ k: "s:" + el.dataset.sym }, ""); return openStock(el.dataset.sym, false); }
    return openStock(el.dataset.sym);
  }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "scrsec") { SCR.sec = e.target.value; return scrRefresh(); }
  if (e.target.id === "scrsort") { SCR.sort = e.target.value; return scrRefresh(); }
  const el = e.target.closest("[data-fto]");
  if (!el) return;
  const [fi, i] = el.dataset.fto.split(":").map(Number), to = +el.value, f = favs();
  if (to === fi) return;
  const [s] = f.folders[fi].syms.splice(i, 1); if (!f.folders[to].syms.includes(s)) f.folders[to].syms.push(s);
  saveFavs(f); $("#sheetBox").innerHTML = folderEditor(fi); $("#t-fav").innerHTML = favTab();
});
let qTimer = null;
document.addEventListener("input", (e) => {
  if (e.target.id === "gq") { const v = e.target.value.trim(), g = $("#glist"); if (g) g.innerHTML = v ? findList(v) : ""; return; }
  if (e.target.id !== "q") return;
  findQ = e.target.value;
  const fl = $("#flist");
  if (fl) { fl.className = findQ ? "card" : ""; fl.innerHTML = findQ ? findList(findQ) : ""; }
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { const v = findQ.trim(); if (v.length >= 2) { const r = store.get("recentq", []).filter((x) => x !== v); r.unshift(v); store.set("recentq", r.slice(0, 8)); } }, 1500);
});
// A8: 옆으로 밀어서 탭 이동 (차트·가로 스크롤 영역 밖에서만)
let sw = null;
document.addEventListener("touchstart", (e) => {
  if (e.touches.length !== 1 || $("#page").classList.contains("on") || e.target.closest("#chartSvg, .mk, .chips, input, .heat, #sheet")) { sw = null; return; }
  sw = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
document.addEventListener("touchend", (e) => {
  if (!sw) return;
  const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) { const i = TABS.indexOf(cur) + (dx < 0 ? 1 : -1); if (i >= 0 && i < TABS.length) show(TABS[i]); }
  sw = null;
}, { passive: true });

async function load() {
  $("#reload").textContent = "…";
  try {
    const [d, idx] = await Promise.all([
      fetch("data.json?t=" + Date.now()).then((r) => r.json()),
      fetch("stocks/index.json?t=" + Date.now()).then((r) => (r.ok ? r.json() : null)).catch(() => null),
    ]);
    D = d; IDX = idx;
    D.tests = D.tests || { recent: [], stats: { count: 0 } }; D.timeline = D.timeline || []; D.briefings = D.briefings || [];
    D.curve = D.curve || { days: [], series: {} }; D.ai = D.ai || {};
    render();
  } catch (e) {
    $("#updated").textContent = "데이터를 불러오지 못했어요";
    if (!D) $("#t-home").innerHTML = `<div class="card"><div class="empty">데이터를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.</div><button class="go" id="retry">다시 시도</button></div>`;
  }
  $("#reload").textContent = "↻";
}
document.addEventListener("click", (e) => { if (e.target.id === "retry") load(); });
$("#reload").onclick = load;
$("#help").onclick = () => onboard(0);
$("#gsearch").onclick = openSearch;
let y0 = null;
window.addEventListener("touchstart", (e) => { y0 = window.scrollY <= 0 && !$("#page").classList.contains("on") && !e.target.closest("#chartSvg, #sheet") ? e.touches[0].clientY : null; }, { passive: true });
window.addEventListener("touchmove", (e) => { if (y0 == null) return; const dy = e.touches[0].clientY - y0; $("#ptr").style.height = Math.min(Math.max(dy - 10, 0), 40) + "px"; $("#ptr").textContent = dy > 70 ? "↻ 놓으면 새로고침" : "↓ 당겨서 새로고침"; }, { passive: true });
window.addEventListener("touchend", () => {
  if (y0 != null && parseInt($("#ptr").style.height || 0) >= 40) { $("#ptr").textContent = "↻ 새로 받는 중…"; load().finally(() => { $("#ptr").style.height = "0"; }); }
  else $("#ptr").style.height = "0";
  y0 = null;
});
setInterval(stamp, 30000);
setInterval(() => { if (document.visibilityState === "visible") load(); }, 300000);
// H3: 오프라인 저장 (개발 중인 내 컴퓨터에서는 끔: 고친 화면이 바로 보이게)
if ("serviceWorker" in navigator && !/^(localhost|127\.)/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
load().then(() => {
  const start = (location.hash.match(/s=([^&]+)/) || [])[1] || (inTg && tg.initDataUnsafe && (tg.initDataUnsafe.start_param || "").replace(/^s_/, ""));
  if (start && D) openStock(decodeURIComponent(start).toUpperCase());
  else if (!store.get("ob_done2")) onboard(0);           // 새 기능 안내: 예전에 본 사람도 한 번 더
});
</script>
